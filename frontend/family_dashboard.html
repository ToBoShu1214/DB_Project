<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧長照 - 家屬安心儀表板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f0f2f5; font-family: "Microsoft JhengHei", sans-serif; }
        .header-bg { background: linear-gradient(135deg, #198754 0%, #20c997 100%); color: white; padding: 25px 0; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .med-item { border-left: 4px solid #dee2e6; transition: 0.3s; }
        .med-item.taken { border-left-color: #198754; background-color: #f1f8f5; opacity: 0.8; }
        .chart-container { position: relative; height: 300px; width: 100%; }
        .info-label { color: #6c757d; font-size: 0.8rem; font-weight: bold; }
        .info-value { font-weight: bold; color: #2c3e50; }
        
        /* 📍 地圖相關樣式 */
        #mapContainer {
            position: relative;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background-color: #fff;
            border: 1px solid #eee;
        }
        #hospitalMap { width: 100%; display: block; }
        .map-label {
            position: absolute;
            font-size: 12px;
            font-weight: 800;
            color: #333;
            pointer-events: none;
            text-align: center;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.7);
            padding: 1px 5px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .resident-marker {
            position: absolute;
            width: 26px;
            height: 26px;
            background-color: #198754;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-success shadow-sm mb-0">
        <div class="container">
            <span class="navbar-brand fw-bold">🏥 智慧長照安心門戶</span>
            <button class="btn btn-outline-light btn-sm fw-bold" onclick="logout()">安全登出</button>
        </div>
    </nav>

    <div class="header-bg text-center mb-4">
        <div class="container">
            <h3 id="residentTitle" class="fw-bold mb-0 text-white">正在載入長輩資料...</h3>
        </div>
    </div>

    <div class="container pb-5">
        <!-- 🚀 住民基本資料摘要區 -->
        <div class="card shadow-sm p-3 mb-4 bg-white border-0">
            <div class="row align-items-center text-center">
                <div class="col-md-2 border-end"><div class="info-label">性別</div><span id="info_sex" class="info-value">--</span></div>
                <div class="col-md-2 border-end"><div class="info-label">年齡</div><span id="info_age" class="info-value">--</span></div>
                <div class="col-md-2 border-end"><div class="info-label">房號</div><span id="info_room" class="info-value text-success">--</span></div>
                <div class="col-md-3 border-end"><div class="info-label">照護等級</div><span id="info_level" class="info-value">--</span></div>
                <div class="col-md-3"><div class="info-label">當前位置</div><span id="locDisplaySummary" class="info-value text-success">偵測中...</span></div>
            </div>
        </div>

        <!-- 🚀 分頁標籤導覽 -->
        <ul class="nav nav-pills nav-fill mb-4 bg-white p-2 rounded shadow-sm" id="familyTabs" role="tablist">
            <li class="nav-item"><button class="nav-link active fw-bold" data-bs-toggle="tab" data-bs-target="#tab-health">📊 生理監控</button></li>
            <li class="nav-item"><button class="nav-link fw-bold" data-bs-toggle="tab" data-bs-target="#tab-records">📝 護理與照護</button></li>
            <li class="nav-item"><button class="nav-link fw-bold" data-bs-toggle="tab" data-bs-target="#tab-medical">💊 醫療處置</button></li>
            <li class="nav-item"><button class="nav-link fw-bold" data-bs-toggle="tab" data-bs-target="#tab-info">🏠 基本資料</button></li>
            <li class="nav-item"><button class="nav-link fw-bold text-success" data-bs-toggle="tab" data-bs-target="#tab-map">📍 即時定位</button></li>
        </ul>

        <div class="tab-content">
            <!-- 1. 生理監控 Tab -->
            <div class="tab-pane fade show active" id="tab-health">
                <div class="row text-center mb-3" id="healthStats"></div>
                <div class="card shadow-sm p-4 mb-4 bg-white border-0">
                    <h5 class="fw-bold mb-4 text-success">📈 近期健康趨勢 (血壓/心跳)</h5>
                    <div class="chart-container"><canvas id="healthChart"></canvas></div>
                </div>

                <div class="card shadow-sm p-4 mb-4 border-success border-top border-3">
                    <h5 class="fw-bold mb-3">📅 歷史生理量測紀錄</h5>
                    <div class="table-responsive">
                        <table class="table table-sm align-middle text-center" id="healthRecordTable">
                            <thead class="table-light">
                                <tr class="small text-muted">
                                    <th>量測時間</th>
                                    <th>收縮壓</th>
                                    <th>舒張壓</th>
                                    <th>心跳</th>
                                    <th class="text-primary">血糖</th>
                                    <th class="text-info">血氧</th>
                                    <th>備註</th>
                                </tr>
                            </thead>
                            <tbody id="healthEditBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 2. 護理與照護 Tab -->
            <div class="tab-pane fade" id="tab-records">
                <div class="row">
                    <div class="col-md-7">
                        <div class="card shadow-sm p-4 border-secondary border-top border-3 h-100">
                            <h5 class="fw-bold mb-4 text-secondary">📝 護理進接紀錄</h5>
                            <div id="notesContainer" class="small overflow-auto" style="max-height: 500px;"></div>
                        </div>
                    </div>
                    <div class="col-md-5">
                        <div class="card shadow-sm p-4 border-info border-top border-3 h-100">
                            <h5 class="fw-bold mb-4 text-info">🧼 日常照護日誌</h5>
                            <div class="table-responsive">
                                <table class="table table-sm align-middle small">
                                    <thead class="table-light">
                                        <tr><th>時間</th><th>沐浴</th><th>尿褲</th><th>備註</th></tr>
                                    </thead>
                                    <tbody id="careLogBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. 醫療處置 Tab -->
            <div class="tab-pane fade" id="tab-medical">
                <div class="row">
                    <div class="col-md-6">
                        <div class="card shadow-sm p-4 mb-4 border-primary border-top border-3 h-100">
                            <h5 class="fw-bold mb-3 text-primary">🏥 醫師醫囑紀錄</h5>
                            <div id="orderHistory" class="small text-muted">尚無醫囑紀錄</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card shadow-sm p-4 mb-4 border-warning border-top border-3 h-100">
                            <h5 class="fw-bold mb-3 text-warning">💊 今日用藥情形</h5>
                            <div id="medList" class="small"></div>
                        </div>
                    </div>
                    <div class="col-12 mt-4">
                        <div class="card shadow-sm p-4 border-success border-top border-3">
                            <h5 class="fw-bold mb-3 text-success">🛡️ 疫苗接種紀錄</h5>
                            <div id="vaccineList" class="row g-3"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4. 基本資料 Tab -->
            <div class="tab-pane fade" id="tab-info">
                <div class="row">
                    <div class="col-md-6">
                        <div class="card shadow-sm p-4 mb-4 h-100">
                            <h5 class="fw-bold mb-3">📋 進階資料</h5>
                            <div class="row g-3">
                                <div class="col-6"><label class="text-muted small">身高/體重</label><div id="info_hw" class="fw-bold">--</div></div>
                                <div class="col-6"><label class="text-muted small">失智等級 (CDR)</label><div><span id="info_cdr" class="badge bg-warning text-dark">--</span></div></div>
                                <div class="col-6"><label class="text-muted small">失能等級 (CMS)</label><div><span id="info_cms" class="badge bg-danger">--</span></div></div>
                                <div class="col-12"><label class="text-muted small">過敏原紀錄</label><div id="info_allergies" class="text-danger fw-bold">無紀錄</div></div>
                                <div class="col-12"><label class="text-muted small">慢性病史</label><div id="diseaseTags" class="d-flex flex-wrap gap-1"></div></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card shadow-sm p-4 mb-4 h-100">
                            <h5 class="fw-bold mb-3">👨‍👩‍👧 登記家屬聯絡資訊</h5>
                            <div id="familyList"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 5. 📍 即時定位 Tab -->
            <div class="tab-pane fade" id="tab-map">
                <div class="card p-4 shadow-sm">
                    <div class="d-flex justify-content-between align-items-end mb-4 border-bottom pb-3">
                        <div>
                            <h4 class="fw-bold mb-1">📍 長輩即時定位監控</h4>
                            <p class="text-muted small mb-0">資料每 30 秒自動更新一次，僅顯示您的關聯長輩</p>
                        </div>
                        <div class="text-center">
                            <h3 id="locDisplay" class="fw-bold text-success mb-0" style="font-size: 2rem;">讀取中</h3>
                            <div id="locTime" class="text-muted" style="font-size: 0.75rem;">最後更新: --</div>
                        </div>
                    </div>
                    <div class="bg-light p-3 rounded text-center">
                        <div id="mapContainer" style="max-width: 900px; margin: 0 auto;">
                            <img src="/Layout.png" id="hospitalMap" alt="Hospital Layout">
                            <div id="mapOverlay"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const residentId = localStorage.getItem('targetResident');
        let healthChart = null;

        if(!residentId) { alert("登入失效，請重新登入"); location.href='/family_login.html'; }

        window.onload = async function() {
            try {
                const res = await fetch(`/api/residents/${residentId}`).then(r => r.json());
                if(res.data) {
                    const d = res.data;
                    document.getElementById('residentTitle').textContent = `照護長輩：${d.FullName} (ID: #${d.ResidentID})`;
                    document.getElementById('info_sex').textContent = d.Sex;
                    document.getElementById('info_room').textContent = d.RoomNumber;
                    document.getElementById('info_level').textContent = d.CareLevel;
                    document.getElementById('info_hw').textContent = `${d.Height || '--'} cm / ${d.Weight || '--'} kg`;
                    document.getElementById('info_cdr').textContent = d.CDR || '--';
                    document.getElementById('info_cms').textContent = d.CMS || '--';
                    document.getElementById('info_allergies').textContent = d.Allergies || '無紀錄';

                    if (d.DateOfBirth) {
                        const age = new Date().getFullYear() - new Date(d.DateOfBirth).getFullYear();
                        document.getElementById('info_age').textContent = `${age} 歲`;
                    }
                }
                init();
            } catch (e) { console.error("載入失敗", e); }
        };

        async function init() {
            try {
                const hRes = await fetch(`/api/residents/${residentId}/health-history-v2`).then(r => r.json());
                loadHealthTable(hRes.data || [], hRes.threshold || 140);
                loadStats();
                loadChart();
                loadMedications();
                loadMedicalProfile();
                loadFamily();
                loadLocation();
                loadNotes();
                loadVaccinations();
                loadCareLogs();
            } catch (e) { console.error("初始化失敗", e); }
        }

        async function loadHealthTable(historyData, threshold) {
            const tbody = document.getElementById('healthEditBody');
            tbody.innerHTML = historyData.map(d => {
                const isHigh = d.SystolicBP > threshold;
                return `
                    <tr>
                        <td class="text-muted small">${new Date(d.RecordTime).toLocaleString([], {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}</td>
                        <td class="${isHigh?'text-danger fw-bold':''}">${d.SystolicBP}</td>
                        <td>${d.DiastolicBP}</td>
                        <td>${d.HeartRate}</td>
                        <td class="text-primary">${d.BloodSugar || '--'}</td>
                        <td class="text-info">${d.BloodOxygen || '--'}</td>
                        <td class="text-muted small">${d.Notes || '無'}</td>
                    </tr>
                `;
            }).join('');
        }

        async function loadStats() {
            const h = await fetch(`/api/reports/health-summary/${residentId}`).then(r => r.json());
            const s = h.summary;
            document.getElementById('healthStats').innerHTML = `
                <div class="col-4"><div class="p-3 bg-white rounded shadow-sm"><h6>平均收縮壓</h6><h3 class="text-danger mb-0">${Math.round(s.AvgSystolic || 0)}</h3></div></div>
                <div class="col-4"><div class="p-3 bg-white rounded shadow-sm"><h6>平均舒張壓</h6><h3 class="text-warning mb-0">${Math.round(s.AvgDiastolic || 0)}</h3></div></div>
                <div class="col-4"><div class="p-3 bg-white rounded shadow-sm"><h6>平均心跳</h6><h3 class="text-primary mb-0">${Math.round(s.AvgHeartRate || 0)}</h3></div></div>
            `;
        }

        async function loadChart() {
            const res = await fetch(`/api/residents/${residentId}/health-history`).then(r => r.json());
            const ctx = document.getElementById('healthChart').getContext('2d');
            const labels = res.data.map(d => new Date(d.RecordTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
            if(healthChart) healthChart.destroy();
            healthChart = new Chart(ctx, { type: 'line', data: { labels: labels, datasets: [ { label: '收縮壓', data: res.data.map(d => d.SystolicBP), borderColor: '#dc3545', tension: 0.3, fill: false }, { label: '心跳', data: res.data.map(d => d.HeartRate), borderColor: '#0d6efd', borderDash: [5, 5], tension: 0.3, fill: false } ] }, options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } } });
        }

        async function loadMedications() {
            const res = await fetch(`/api/residents/${residentId}/medications`).then(r => r.json());
            document.getElementById('medList').innerHTML = res.data.map(m => `
                <div class="med-item p-2 mb-2 shadow-sm border rounded ${m.IsTaken ? 'taken' : ''}">
                    <div class="d-flex justify-content-between align-items-center">
                        <div><span class="badge bg-secondary me-1">${m.Schedule}</span><strong>${m.MedName}</strong><div class="text-muted small">${m.Dosage}</div></div>
                        ${m.IsTaken ? '<span class="badge bg-success">✅ 已服用</span>' : '<span class="badge bg-light text-dark border">⏳ 待執行</span>'}
                    </div>
                </div>
            `).join('');
        }

        async function loadMedicalProfile() {
            const res = await fetch(`/api/residents/${residentId}/medical-profile`).then(r => r.json());
            document.getElementById('diseaseTags').innerHTML = res.diseases.map(d => `<span class="badge bg-info text-dark border">${d.DiseaseName}</span>`).join('') || '<span class="text-muted small">無紀錄</span>';
            document.getElementById('orderHistory').innerHTML = res.orders.map(o => `
                <div class="border-start ps-2 mb-3">
                    <div class="fw-bold text-dark">${o.MedName} <small>(${o.Dosage})</small></div>
                    <div style="font-size: 0.7rem;">時段: ${o.Schedule} | 囑咐: ${o.OrderContent}</div>
                    <div style="font-size: 0.65rem;" class="text-muted">${new Date(o.CreateTime).toLocaleString()}</div>
                </div>
            `).join('') || '尚無紀錄';
        }

        async function loadLocation() {
            try {
                const res = await fetch(`/api/residents/${residentId}/location`).then(r => r.json());
                const display = document.getElementById('locDisplay');
                const summaryDisplay = document.getElementById('locDisplaySummary');
                if(res.data) {
                    display.textContent = res.data.Zone;
                    summaryDisplay.textContent = res.data.Zone;
                    document.getElementById('locTime').textContent = `最後更新: ${new Date(res.data.Timestamp).toLocaleTimeString()}`;
                    renderFamilyMap(res.data);
                }
            } catch (e) { console.error("定位加載失敗", e); }
        }

        const MAP_ZONES_CONFIG = [
            { name: "401房", labelPos: [15.05, 26.54] }, { name: "402房", labelPos: [36.46, 63.33] }, { name: "403房", labelPos: [45.12, 30.42] }, { name: "404房", labelPos: [45.43, 64.83] }, { name: "405房", labelPos: [54.10, 30.63] },
            { name: "406房", labelPos: [53.79, 67.85] }, { name: "407房", labelPos: [62.62, 30.42] }, { name: "408房", labelPos: [62.77, 68.49] }, { name: "409房", labelPos: [71.28, 30.63] }, { name: "410房", labelPos: [71.90, 65.48] },
            { name: "411房", labelPos: [80.73, 67.85] }, { name: "412房", labelPos: [89.55, 67.42] }, { name: "行政辦公室", labelPos: [81.66, 31.28] }, { name: "護理站", labelPos: [12.31, 49.99] }, { name: "護理休息室", labelPos: [14.78, 70.00] },
            { name: "交誼廳", labelPos: [26.85, 62.83] }, { name: "走廊", labelPos: [53.48, 46.77] }, { name: "樓梯", labelPos: [91.65, 24.31] }, { name: "電梯", labelPos: [37.45, 36.41] }
        ];

        function renderFamilyMap(loc) {
            const overlay = document.getElementById('mapOverlay');
            overlay.innerHTML = '';
            MAP_ZONES_CONFIG.forEach(z => {
                const label = document.createElement('div');
                label.className = 'map-label';
                label.style.left = z.labelPos[0] + '%';
                label.style.top = z.labelPos[1] + '%';
                label.textContent = z.name;
                overlay.appendChild(label);
            });
            const container = document.getElementById('mapContainer');
            const oldMarker = container.querySelector('.resident-marker');
            if(oldMarker) oldMarker.remove();
            const marker = document.createElement('div');
            marker.className = 'resident-marker';
            marker.style.left = loc.X_Coordinate + '%';
            marker.style.top = loc.Y_Coordinate + '%';
            marker.textContent = "📍";
            container.appendChild(marker);
        }

        async function loadNotes() {
            const res = await fetch(`/api/residents/${residentId}/notes`).then(r => r.json());
            document.getElementById('notesContainer').innerHTML = res.data.map(n => `
                <div class="mb-3 pb-2 border-bottom">
                    <div class="d-flex justify-content-between mb-1"><span class="fw-bold text-secondary">${n.StaffName}</span><span class="text-muted small">${new Date(n.CreateTime).toLocaleString()}</span></div>
                    <div>${n.NoteContent}</div>
                </div>
            `).join('') || '<div class="text-center text-muted py-3">尚無紀錄</div>';
        }

        async function loadVaccinations() {
            const res = await fetch(`/api/residents/${residentId}/vaccinations`).then(r => r.json());
            document.getElementById('vaccineList').innerHTML = res.data.map(v => `
                <div class="border-bottom pb-2 mb-2">
                    <div class="fw-bold text-dark">${v.VaccineType} <small class="text-muted">(${v.Brand})</small></div>
                    <div style="font-size: 0.7rem;">施打日: ${v.DoseDate}</div>
                    ${v.NextDoseDate ? `<div class="text-success fw-bold" style="font-size: 0.7rem;">預計補打: ${v.NextDoseDate}</div>` : ''}
                </div>
            `).join('') || '<div class="text-center text-muted py-2">尚無紀錄</div>';
        }

        async function loadCareLogs() {
            const res = await fetch(`/api/daily-care?res_id=${residentId}`).then(r => r.json());
            document.getElementById('careLogBody').innerHTML = res.data.map(d => `
                <tr>
                    <td style="font-size:0.7rem;">${new Date(d.RecordTime).toLocaleString([], {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}</td>
                    <td>${d.BathStatus ? '✅' : '❌'}</td>
                    <td>${d.DiaperCount}次</td>
                    <td class="small">${d.WoundNote || '無'}</td>
                </tr>
            `).join('') || '<tr><td colspan="4" class="text-center text-muted py-3">尚無紀錄</td></tr>';
        }

        async function loadFamily() {
            const f = await fetch(`/api/residents/${residentId}/family`).then(r => r.json());
            document.getElementById('familyList').innerHTML = f.data.map(fm => `<div class="border-bottom py-2"><strong>${fm.FullName}</strong> <small>(${fm.Relationship})</small> ${fm.IsEmergencyContact ? '<span class="badge bg-danger">緊急</span>' : ''}<br><small class="text-muted">${fm.Phone}</small></div>`).join('');
        }

        function logout() { localStorage.clear(); location.href='/family_login.html'; }
        
        // 每 30 秒自動更新一次定位
        setInterval(loadLocation, 30000);
    </script>
</body>
</html>
