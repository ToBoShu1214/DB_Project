<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家屬安心儀表板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f4f6f9; font-family: sans-serif; }
        .card { border-radius: 15px; border: none; margin-bottom: 20px; }
        .header-bg { background: linear-gradient(135deg, #198754 0%, #20c997 100%); color: white; padding: 30px 20px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; box-shadow: 0 4px 15px rgba(32,201,151,0.3); }
        .chart-container { position: relative; height: 250px; width: 100%; }
        .med-taken { color: #198754; font-weight: bold; }
        .med-pending { color: #dc3545; }
    </style>
</head>
<body>

    <div class="header-bg text-center mb-4 position-relative">
        <button class="btn btn-sm btn-outline-light position-absolute top-0 end-0 m-3" onclick="logout()">登出</button>
        <h2 class="fw-bold mb-1">🏥 智慧安心照護</h2>
        <h5 id="resNameTitle" class="mt-3 bg-white text-success d-inline-block px-3 py-1 rounded-pill fw-bold shadow-sm">載入中...</h5>
    </div>

    <div class="container pb-5">
        <div class="card shadow-sm"><div class="card-body text-center"><h6 class="text-muted fw-bold mb-2">📍 目前位置狀態</h6><h2 id="locDisplay" class="fw-bold text-primary mb-1">載入中...</h2><small class="text-muted" id="locTime">--</small></div></div>
        <div class="card shadow-sm"><div class="card-body"><h6 class="text-muted fw-bold mb-3">📈 近期血壓趨勢</h6><div class="chart-container"><canvas id="familyChart"></canvas></div></div></div>
        <div class="card shadow-sm"><div class="card-body"><h6 class="text-muted fw-bold mb-3">💊 今日用藥狀況</h6><ul class="list-group list-group-flush" id="medList"></ul></div></div>
    </div>

    <script>
        const residentId = localStorage.getItem('targetResident');
        if (!residentId) { alert('請重新登入！'); window.location.href = '/family_login.html'; }

        async function init() {
            loadResidentInfo();
            loadLocation();
            loadChart();
            loadMedications();
        }

        function logout() { localStorage.clear(); window.location.href = '/family_login.html'; }

        // 🚀 新增：去後端抓取長輩真實姓名並顯示
        async function loadResidentInfo() {
            const res = await fetch(`/api/residents/${residentId}`).then(r => r.json());
            if(res.data) {
                document.getElementById('resNameTitle').textContent = `照護對象：${res.data.FullName} (ID: #${res.data.ResidentID})`;
            }
        }

        async function loadLocation() {
            const res = await fetch(`/api/residents/${residentId}/location`).then(r => r.json());
            const display = document.getElementById('locDisplay');
            if (res.data) {
                display.textContent = res.data.Zone;
                document.getElementById('locTime').textContent = `更新時間：${new Date(res.data.Timestamp).toLocaleTimeString()}`;
                if(res.data.Zone === '樓梯間') display.className = 'fw-bold text-danger';
            } else { display.textContent = '在房內休息'; }
        }

        async function loadChart() {
            const res = await fetch(`/api/residents/${residentId}/health-history`).then(r => r.json());
            const ctx = document.getElementById('familyChart').getContext('2d');
            const labels = res.data.map(d => new Date(d.RecordTime).toLocaleDateString().substring(5));
            const sysData = res.data.map(d => d.SystolicBP);
            const diaData = res.data.map(d => d.DiastolicBP);

            new Chart(ctx, { type: 'line', data: { labels: labels, datasets: [ { label: '收縮壓', data: sysData, borderColor: '#dc3545', tension: 0.4 }, { label: '舒張壓', data: diaData, borderColor: '#ffc107', tension: 0.4 } ] }, options: { maintainAspectRatio: false, plugins: { legend: { position: 'top' } } } });
        }

        async function loadMedications() {
            const res = await fetch(`/api/residents/${residentId}/medications`).then(r => r.json());
            const list = document.getElementById('medList');
            if (res.data.length === 0) { list.innerHTML = '<li class="list-group-item text-muted">今日無特別醫囑</li>'; return; }
            list.innerHTML = res.data.map(m => `<li class="list-group-item d-flex justify-content-between align-items-center"><div><strong>${m.MedName}</strong> <small class="text-muted">(${m.Schedule})</small></div><span class="${m.IsTaken ? 'med-taken' : 'med-pending'}">${m.IsTaken ? '✅ 已服用' : '⏳ 待服用'}</span></li>`).join('');
        }

        init();
    </script>
</body>
</html>
