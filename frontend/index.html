<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧長照管理系統 - 入口</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .portal-card { width: 100%; max-width: 600px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); border-radius: 12px; background-color: white; padding: 40px; text-align: center; }
        .btn-huge { padding: 20px; font-size: 1.25rem; border-radius: 10px; transition: 0.3s; }
        .btn-huge:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="portal-card">
        <h1 class="fw-bold text-primary mb-2">🏥 智慧長照管理系統</h1>
        <p class="text-muted mb-5">請選擇您的身份入口</p>
        
        <div class="row g-4">
            <div class="col-md-6">
                <button onclick="location.href='/family_login.html'" class="btn btn-success btn-huge w-100 fw-bold">
                    <div class="fs-1 mb-2">👨‍👩‍👧</div>家屬安心入口
                </button>
            </div>
            <div class="col-md-6">
                <button onclick="location.href='/staff_login.html'" class="btn btn-primary btn-huge w-100 fw-bold">
                    <div class="fs-1 mb-2">🩺</div>醫護人員入口
                </button>
            </div>
        </div>
    </div>
</body>
</html>
